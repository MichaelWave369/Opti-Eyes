name: Validate Opti-Eyes Lab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm run build
      - name: Assert static distribution
        run: test -s dist/index.html && test -s dist/src/component-model.mjs && test -s dist/src/component-studio.mjs && test -s dist/src/frame-model.mjs && test -s dist/src/hardware-studio.mjs && test -s dist/src/optics.mjs && test -s dist/vendor/genewrist/src/core.js && test -s dist/vendor/genewrist/LICENSE && test -f dist/.nojekyll
